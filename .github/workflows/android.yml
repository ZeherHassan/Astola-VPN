name: Build Astola VPN APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Debug APKs
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload Astola VPN Client APK
      uses: actions/upload-artifact@v4
      with:
        name: AstolaVPN-Client-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Astola VPN Admin APK
      uses: actions/upload-artifact@v4
      with:
        name: AstolaVPN-Admin-Debug-APK
        path: admin/build/outputs/apk/debug/admin-debug.apk
